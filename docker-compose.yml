x-app: &app
  build: .
  image: webflux-chat:local
  restart: unless-stopped
  environment:
    SPRING_PROFILES_ACTIVE: redis
    SPRING_MONGODB_URI: mongodb://root:${MONGO_PASSWORD:-example}@mongo:27017/chat?authSource=admin
    SPRING_DATA_REDIS_HOST: redis
    JWT_SECRET: ${JWT_SECRET:-dev-only-secret-change-me-before-deploy-0123456789}
  depends_on:
    mongo:
      condition: service_healthy
    redis:
      condition: service_healthy
  healthcheck:
    test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health | grep -q UP"]
    interval: 10s
    timeout: 3s
    retries: 5
    start_period: 40s

services:
  mongo:
    image: mongo:9
    restart: always
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:-example}
    ports:
      - "${MONGO_PORT:-27017}:27017"
    volumes:
      - webflux_db:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "-u", "root", "-p", "${MONGO_PASSWORD:-example}", "--authenticationDatabase", "admin", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  redis:
    image: redis:7-alpine
    restart: always
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  app1:
    <<: *app

  app2:
    <<: *app

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "${CHAT_PORT:-8080}:80"
    volumes:
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      app1:
        condition: service_healthy
      app2:
        condition: service_healthy

volumes:
  webflux_db:
