# Balanceia as conexões entre as duas instâncias da aplicação.
# least_conn: os streams SSE duram horas, então vale mandar a nova conexão para quem tem menos abertas;
# zone: compartilha esse estado entre os workers do nginx (sem ela, cada worker conta sozinho).
upstream chat {
    zone chat 64k;
    least_conn;
    server app1:8080;
    server app2:8080;
}

server {
    listen 80;

    location / {
        proxy_pass http://chat;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # SSE: sem buffer o nginx seguraria os eventos até encher o buffer
        proxy_buffering off;
        proxy_cache off;
        # a conexão do stream fica aberta por horas
        proxy_read_timeout 1h;

        # mostra qual instância atendeu (útil para demonstrar o balanceamento)
        add_header X-Instance $upstream_addr always;
    }
}
