spring.application.name=webflux-chat
spring.mongodb.uri=mongodb://root:example@localhost:27017/chat?authSource=admin
# necessário para o índice único de users.username
spring.data.mongodb.auto-index-creation=true

app.jwt.secret=${JWT_SECRET:dev-only-secret-change-me-before-deploy-0123456789}
app.jwt.ttl=PT12H

# Redis só é usado com o perfil "redis" (--spring.profiles.active=redis); sem ele o chat roda numa instância só
management.health.redis.enabled=false
