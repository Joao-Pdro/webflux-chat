<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WebFlux Chat</title>
<style>
  body { font: 16px system-ui, sans-serif; max-width: 640px; margin: 2rem auto; padding: 0 1rem; }
  #log { border: 1px solid #ccc; border-radius: 6px; height: 360px; overflow-y: auto; padding: .5rem; margin: 1rem 0; }
  #log p { margin: .25rem 0; }
  form { display: flex; gap: .5rem; }
  #text { flex: 1; }
  input, button { font: inherit; padding: .4rem; }
</style>
</head>
<body>
<h1>WebFlux Chat</h1>
<label>Sala <input id="room" value="geral"></label>
<label>Nome <input id="user" value="anon"></label>
<button id="join">Entrar</button>
<div id="log"></div>
<form id="form">
  <input id="text" placeholder="Mensagem" autocomplete="off" required>
  <button>Enviar</button>
</form>
<script>
  const $ = id => document.getElementById(id);
  let es;

  $('join').onclick = () => {
    if (es) es.close();
    $('log').textContent = '';
    es = new EventSource(`/rooms/${encodeURIComponent($('room').value)}/stream`);
    es.onmessage = e => {
      const m = JSON.parse(e.data);
      const p = document.createElement('p');
      p.textContent = `${m.user}: ${m.text}`;
      $('log').append(p);
      $('log').scrollTop = $('log').scrollHeight;
    };
  };

  $('form').onsubmit = async e => {
    e.preventDefault();
    await fetch(`/rooms/${encodeURIComponent($('room').value)}/messages`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ user: $('user').value, text: $('text').value })
    });
    $('text').value = '';
  };

  $('join').click();
</script>
</body>
</html>
